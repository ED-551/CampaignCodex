version: '3.9'

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: campaigncodex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       campaigncodex
      POSTGRES_USER:     campaigncodex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaigncodex"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaigncodex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3001
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        campaigncodex
      DB_USER:        campaigncodex
      DB_PASSWORD:    ${DB_PASSWORD:-changeme}
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      CLIENT_URL:     ${CLIENT_URL:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM:     ${EMAIL_FROM:-noreply@campaigncodex.com}
      UPLOAD_DIR:     /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campaigncodex-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
