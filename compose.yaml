# CampaignCodex — Docker / Podman Compose
#
# Run your own instance with prebuilt images (no source checkout needed —
# just this file and a .env next to it):
#
#   1. cp .env.example .env   and fill in the required values
#   2. docker compose up -d   (or: podman-compose up -d)
#   3. open http://localhost:8080 and log in with ADMIN_USERNAME / ADMIN_PASSWORD
#
# To build the images from source instead of pulling them:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The API applies the database schema and migrations automatically on start.

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       campaigncodex
      POSTGRES_USER:     campaigncodex
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaigncodex -d campaigncodex"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

  # ── Backend API (Node 20 / Express 5) ────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ed-551/campaigncodex-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:                production
      PORT:                    3001
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_NAME:                 campaigncodex
      DB_USER:                 campaigncodex
      DB_PASSWORD:             ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
      JWT_SECRET:              ${JWT_SECRET:?JWT_SECRET is required — see .env.example}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-24h}
      CLIENT_URL:              ${CLIENT_URL:?CLIENT_URL is required — see .env.example}
      ADMIN_USERNAME:          ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD:          ${ADMIN_PASSWORD:-}
      # The account allowed to grant admin/moderator roles. Defaults to the
      # seeded admin so a fresh install can manage roles out of the box.
      PRIMARY_ADMIN_USERNAME:  ${PRIMARY_ADMIN_USERNAME:-${ADMIN_USERNAME:-}}
      RESEND_API_KEY:          ${RESEND_API_KEY:-}
      EMAIL_FROM:              ${EMAIL_FROM:-noreply@example.com}
      SMTP_HOST:               ${SMTP_HOST:-}
      SMTP_PORT:               ${SMTP_PORT:-587}
      SMTP_USER:               ${SMTP_USER:-}
      SMTP_PASS:               ${SMTP_PASS:-}
      SMTP_SECURE:             ${SMTP_SECURE:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-auto}
      TRUST_PROXY:             ${TRUST_PROXY:-1}
      UPLOAD_DIR:              /app/uploads
      VTT_ENABLED:             ${VTT_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
    # Not published to the host — nginx in the frontend container proxies to it
    expose:
      - "3001"
    # Also declared in the Dockerfile; repeated here because Podman ignores
    # Dockerfile HEALTHCHECKs in OCI-format images.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 30s

  # ── Frontend (Vite build served by nginx) ────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ed-551/campaigncodex-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VTT_ENABLED: ${VTT_ENABLED:-false}
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads_data:
