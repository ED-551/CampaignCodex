# CampaignCodex — Podman / Docker Compose
#
# Quick start:
#   1. Copy .env.example to .env and fill in values
#   2. podman-compose up -d        (Podman)
#      docker compose up -d        (Docker)
#
# For Podman on RHEL/Alma Linux the :Z volume suffix is used on bind-mounts
# to apply the correct SELinux context. Named volumes (postgres_data,
# uploads_data) handle their own context automatically.

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: campaigncodex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       campaigncodex
      POSTGRES_USER:     campaigncodex
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql initialises a fresh DB — runs only once on first start
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaigncodex"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

  # ── Backend API (Node 20 / Express 5) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/ed-551/campaigncodex-backend:latest}
    container_name: campaigncodex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:                production
      PORT:                    3001
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_NAME:                 campaigncodex
      DB_USER:                 campaigncodex
      DB_PASSWORD:             ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET:              ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-24h}
      CLIENT_URL:              ${CLIENT_URL:?CLIENT_URL is required}
      ADMIN_USERNAME:          ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD:          ${ADMIN_PASSWORD:-}
      PRIMARY_ADMIN_USERNAME:  ${PRIMARY_ADMIN_USERNAME:-}
      RESEND_API_KEY:          ${RESEND_API_KEY:-}
      EMAIL_FROM:              ${EMAIL_FROM:-noreply@example.com}
      UPLOAD_DIR:              /app/uploads
      VTT_ENABLED:             ${VTT_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
    # Port not exposed to host — nginx in the frontend container proxies to it
    expose:
      - "3001"

  # ── Frontend (Vite build served by nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/ed-551/campaigncodex-frontend:latest}
    container_name: campaigncodex-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads_data:
