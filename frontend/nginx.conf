server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 10 MB by the API; nginx's 1 MB default would reject
    # most VTT maps before they ever reach it.
    client_max_body_size 12m;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; frame-src 'none';"
        always;
    add_header X-Frame-Options       "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy    "camera=(), microphone=(), geolocation=()" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite produces content-hashed filenames — safe to cache 1 year.
    location ~* \.(?:js|css|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    location ~* \.(?:svg|ico|png|jpg|webp|avif|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # config.js is rewritten at container start (instance settings) — never cache it
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html must never be cached — it references the hashed asset filenames
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── WebSocket proxy (Socket.io) ───────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Uploaded files proxy ──────────────────────────────────────────────────
    # ^~ stops the image-caching regex above from claiming /uploads/*.png etc.
    # and trying to serve them from the static root (404).
    location ^~ /uploads/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
