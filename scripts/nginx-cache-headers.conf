# ─────────────────────────────────────────────────────────────────────────────
# nginx-cache-headers.conf — Add this block inside your campaigncodex server{}.
#
# Vite builds produce hashed filenames (e.g. vendor-react-DIzMTU7r.js).
# When a file changes, its hash changes and the old file is never requested again.
# So it is safe to cache these assets for 1 year ("immutable").
#
# index.html must NEVER be cached — it's the entry point that references
# the hashed assets. If it were cached, users would load stale chunks.
#
# DEPLOY: paste this block inside the existing server { } block in
#         /etc/nginx/conf.d/campaigncodex.conf, then:
#         sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

    # ── Hashed static assets: cache 1 year, immutable ────────────────────────
    location ~* \.(?:js|css|woff2|woff|ttf)$ {
        root /home/ragnarok1414/campaigncodex/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # ── Images / icons / manifests: cache 30 days ────────────────────────────
    location ~* \.(?:svg|ico|png|jpg|webp|avif|webmanifest)$ {
        root /home/ragnarok1414/campaigncodex/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── index.html: never cache (always re-validate) ─────────────────────────
    location = /index.html {
        root /home/ragnarok1414/campaigncodex/frontend/dist;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
    }
