name: Deploy to Production

# Production (Alma2) runs CampaignCodex as a rootless Podman stack in
# ~/campaigncodex-stack. Deploy once the images for main have been published,
# then pull them and recreate the containers.
on:
  workflow_run:
    workflows: [Publish Container Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull & Restart Stack
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    env:
      STACK_DIR: /home/ragnarok1414/campaigncodex-stack
      PODMAN_COMPOSE: /home/ragnarok1414/.local/bin/podman-compose

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Update compose file
        run: cp compose.yaml "$STACK_DIR/compose.yaml"

      - name: Pull images
        working-directory: ${{ env.STACK_DIR }}
        run: $PODMAN_COMPOSE pull

      - name: Restart stack
        working-directory: ${{ env.STACK_DIR }}
        # :latest keeps the same tag when its image changes, so recreate
        # explicitly rather than rely on change detection.
        run: $PODMAN_COMPOSE up -d --force-recreate

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && exit 0
            sleep 3
          done
          echo "Health check failed"
          podman logs --tail 50 campaigncodex-stack_backend_1 || true
          exit 1

      - name: Remove old images
        if: success()
        run: podman image prune -f
