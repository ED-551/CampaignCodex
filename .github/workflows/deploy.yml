name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/ragnarok1414/CampaignCodex
          git pull origin main

      - name: Install frontend deps
        run: cd /home/ragnarok1414/CampaignCodex/frontend && npm ci

      - name: Build frontend
        run: cd /home/ragnarok1414/CampaignCodex/frontend && npm run build

      - name: Install backend deps
        run: cd /home/ragnarok1414/CampaignCodex/backend && npm ci --omit=dev

      - name: Restart API
        run: pm2 restart campaigncodex-api

      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:3001/api/health || (echo "Health check failed" && exit 1)
